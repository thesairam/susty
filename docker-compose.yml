services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: susty
      POSTGRES_USER: susty
      POSTGRES_PASSWORD: susty_dev_5057
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susty"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://susty:susty_dev_5057@postgres:5432/susty
      JWT_SECRET: susty-jwt-s3cr3t-ch4ng3-1n-pr0d
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "5057:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
